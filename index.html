<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#faf7f5;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea{font-family:inherit;outline:none}
.page{display:none;min-height:100vh;padding-bottom:40px}
.page.active{display:block}
.logo{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:0 0 20px 20px;margin-bottom:20px}
.logo-badge{background:white;border-radius:10px;padding:5px 10px;text-align:center}
.logo-big{font-size:20px;font-weight:800;letter-spacing:2px;line-height:1}
.logo-sub{font-size:7px;letter-spacing:1px;margin-top:2px}
.logo-tiny{font-size:5.5px;color:#888;letter-spacing:.5px}
.logo-title{color:white;font-size:15px;font-weight:600}
.logo-desc{color:rgba(255,255,255,.8);font-size:11px;margin-top:2px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:600;text-align:center;cursor:pointer}
.btn-primary{color:white}
.progress{height:6px;border-radius:3px;background:#f0f0f0;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;transition:width .3s}
.badge{display:inline-block;border-radius:8px;padding:2px 10px;font-size:11px;font-weight:600}
.wrap{max-width:500px;margin:0 auto;padding:0 16px}
input[type=text],input[type=password],textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #e0e0e0;font-size:15px}
audio{width:100%}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:white;border-radius:24px;padding:32px 28px;max-width:320px;width:100%;text-align:center;animation:popIn .3s ease}
#confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:9999}
</style>
</head>

        <div style="display:flex;gap:8px" id="brand-btns"></div>
      </div>
      <div style="margin-top:10px;font-size:11px;color:#aaa;text-align:center">📱 같은 이름으로 접속하면 진도가 유지돼요</div>

  </div>
</div>

<!-- 단계 목록 -->

        <div id="stages-sub" style="font-size:13px;color:#888"></div>
      </div>
      <div style="background:#f5e8e0;border-radius:12px;padding:8px 14px;text-align:center">

    </div>

    <button id="btn-logout" class="btn" style="margin-top:8px;background:white;color:#888;border:1px solid #e0e0e0;font-size:13px">로그아웃</button>
  </div>
</div>

<!-- 과제 목록 -->
<div id="p-list" class="page">
  <div id="logo-list" class="logo"></div>
  <div class="wrap">
    <button class="back-btn" data-to="stages" style="margin-bottom:12px;padding:8px 16px;border-radius:10px;background:white;color:#666;border:1px solid #e0e0e0;font-size:13px">← 전체 단계</button>
    <div id="list-header" style="display:flex;align-items:center;gap:10px;margin-bottom:14px"></div>
    <div id="task-list"></div>
  </div>
</div>

<!-- 과제 상세 -->
<div id="p-task" class="page">
  <div id="logo-task" class="logo"></div>
  <div class="wrap">
    <button class="back-btn" data-to="list" style="margin-bottom:12px;padding:8px 16px;border-radius:10px;background:white;color:#666;border:1px solid #e0e0e0;font-size:13px">← 과제 목록</button>
    <div id="task-detail"></div>
  </div>
</div>

<!-- 선생님 대시보드 -->
<div id="p-teacher" class="page">
  <div id="logo-teacher" class="logo"></div>
  <div class="wrap">
    <button onclick="show('login')" style="margin-bottom:12px;padding:8px 16px;border-radius:10px;background:white;color:#666;border:1px solid #e0e0e0;font-size:13px">← 로그인으로</button>
    <div id="teacher-content"></div>
  </div>
</div>

<div id="confetti-layer"></div>
<div id="modal-area"></div>

// ── TTS ──
function getBestVoice(){const vs=speechSynthesis.getVoices();return vs.find(x=>x.lang==="en-US"&&x.name.toLowerCase().includes("female"))||vs.find(x=>x.lang==="en-US")||vs.find(x=>x.lang.startsWith("en"))||null;}
function spk(text,rate=0.85){speechSynthesis.cancel();const go=()=>{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate;u.pitch=1.1;const v=getBestVoice();if(v)u.voice=v;speechSynthesis.speak(u);};speechSynthesis.getVoices().length>0?go():(speechSynthesis.onvoiceschanged=()=>{go();speechSynthesis.onvoiceschanged=null;});}
function spkAll(words){speechSynthesis.cancel();const go=()=>{const v=getBestVoice();let i=0;function next(){if(i>=words.length)return;const u=new SpeechSynthesisUtterance(words[i++].w);u.lang="en-US";u.rate=0.8;u.pitch=1.1;if(v)u.voice=v;u.onend=()=>setTimeout(next,600);speechSynthesis.speak(u);}next();};speechSynthesis.getVoices().length>0?go():(speechSynthesis.onvoiceschanged=()=>{go();speechSynthesis.onvoiceschanged=null;});}

// ── Firebase helpers ──
async function fbGet(p){try{const t=new Promise((_,r)=>setTimeout(()=>r("timeout"),5000));return await Promise.race([window._fbGet(p),t]);}catch{return null;}}
async function fbSet(p,v){try{await window._fbSet(p,v);}catch{}}

// ── 저장 ──
async function saveDone(){
  try{await fbSet(`students/${student}/done`,done);}
  catch{localStorage.setItem(`wawa_${student}`,JSON.stringify(done));}
}

// ── 색상 헬퍼 ──
function stOf(id){return STAGES.find(s=>s.id===id);}
function doneCount(sid){return sid?TASKS.filter(t=>t.stage===sid&&done[`task_${t.id}`]).length:TASKS.filter(t=>done[`task_${t.id}`]).length;}
function totCount(sid){return sid?TASKS.filter(t=>t.stage===sid).length:TASKS.length;}

// ── 컨페티 ──
function confetti(){
  const layer=document.getElementById("confetti-layer");layer.innerHTML="";
  const cols=["#D4622A","#f5a623","#4CAF50","#2196F3","#9C27B0"];
  for(let i=0;i<30;i++){const d=document.createElement("div");d.style.cssText=`position:absolute;left:${Math.random()*100}%;top:-10px;width:8px;height:8px;border-radius:${Math.random()>.5?"50%":"2px"};background:${cols[i%5]};animation:fall ${1.5+Math.random()}s ease-in forwards;animation-delay:${Math.random()*0.5}s`;layer.appendChild(d);}
  setTimeout(()=>layer.innerHTML="",3000);
}

async function doLogin(){
  const n=document.getElementById("inp-name").value.trim();
  if(!n)return;
  const btn=document.getElementById("btn-login");
  btn.textContent="불러오는 중...";btn.disabled=true;
  const data=await fbGet(`students/${n}/done`);
  if(data)done=data;
  else{try{done=JSON.parse(localStorage.getItem(`wawa_${n}`)||"{}");}catch{done={};}}
  student=n;btn.textContent="시작하기 →";btn.disabled=false;
  renderStages();show("stages");
}

  if(document.getElementById("inp-pw").value===TEACHER_PW){renderTeacher();show("teacher");}

}

  document.getElementById("stages-pct").textContent=pct+"%";

    row.style.display="flex";row.style.flexDirection=isSentence?"column":"row";row.style.gap="8px";
    const wb=document.createElement("button");
    wb.style.cssText=`flex:1;padding:${isSentence?"12px 16px":"10px 16px"};border-radius:14px;background:${st.bg};color:${st.color};border:1.5px solid ${st.color};font-size:${isSentence?14:16}px;font-weight:${isSentence?500:700};text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.5`;
    wb.innerHTML=`<span>${item.w}</span><span style="font-size:12px;opacity:.7">🔊</span>`;
    wb.onclick=()=>{wb.style.background=st.color;wb.style.color="white";spk(item.w,isSentence?0.75:0.85);setTimeout(()=>{wb.style.background=st.bg;wb.style.color=st.color;},1500);};
    const mb=document.createElement("button");
    mb.style.cssText=`padding:10px 14px;border-radius:14px;background:#f5f5f5;color:#666;border:1.5px solid #e0e0e0;font-size:13px;font-weight:600`;
    mb.textContent="뜻 보기";
    mb.onclick=()=>{meanings[item.w]=!meanings[item.w];mb.textContent=meanings[item.w]?item.m:"뜻 보기";mb.style.background=meanings[item.w]?"#FFF9C4":"#f5f5f5";mb.style.color=meanings[item.w]?"#795548":"#666";};
    row.appendChild(wb);row.appendChild(mb);
    wl.appendChild(row);
  });

  audioBlob=null;audioURL=null;isRecording=false;
}

function toggleRec(){
  if(!isRecording){
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      recChunks=[];recMediaRecorder=new MediaRecorder(stream);
      recMediaRecorder.ondataavailable=e=>recChunks.push(e.data);
      recMediaRecorder.onstop=()=>{
        audioBlob=new Blob(recChunks,{type:"audio/webm"});
        audioURL=URL.createObjectURL(audioBlob);
        document.getElementById("preview-audio").src=audioURL;
        document.getElementById("audio-preview").style.display="block";
        updateSubmitBtn();
        stream.getTracks().forEach(t=>t.stop());
      };
      recMediaRecorder.start();isRecording=true;
      const btn=document.getElementById("rec-btn");
      btn.textContent="⏹️ 녹음 중지";btn.style.background="#e53935";btn.style.animation="pulse 1s infinite";
    }).catch(()=>alert("마이크 권한을 허용해 주세요."));
  }else{
    recMediaRecorder?.stop();isRecording=false;
    const btn=document.getElementById("rec-btn");
    btn.textContent="🎙️ 녹음 시작";btn.style.background=B().primary;btn.style.animation="";
  }
}

function handleFile(e){
  const f=e.target.files[0];if(!f)return;
  audioBlob=f;audioURL=URL.createObjectURL(f);
  document.getElementById("preview-audio").src=audioURL;
  document.getElementById("audio-preview").style.display="block";
  updateSubmitBtn();
}

function updateSubmitBtn(){
  const area=document.getElementById("submit-area");if(!area)return;
  area.innerHTML=`<button onclick="doSubmit()" style="width:100%;padding:14px;border-radius:12px;background:${B().primary};color:white;border:none;font-size:15px;font-weight:700">✅ 숙제 제출하기!</button>`;
}

async function doSubmit(){
  const btn=document.querySelector("#submit-area button");
  if(btn){btn.textContent="📤 업로드 중...";btn.disabled=true;}
  if(audioBlob){
    const reader=new FileReader();
    reader.readAsDataURL(audioBlob);
    reader.onloadend=async()=>{
      try{await fbSet(`students/${student}/audio/task_${selTask.id}`,reader.result);}catch{}
      await markDone();
    };
  }else{await markDone();}
}

async function markDone(){
  done[`task_${selTask.id}`]=true;
  await saveDone();
  confetti();
  modal(`<div class="modal-box"><div style="font-size:52px;margin-bottom:12px">🎉</div><div style="font-size:20px;font-weight:700;color:#333;margin-bottom:8px">완료!</div><div style="font-size:14px;color:#555;line-height:1.7;margin-bottom:6px"><span style="font-weight:700;color:${B().primary}">${student}</span> 학생,<br><b>${selTask.title}</b> 과제를 완료했어요!</div><div style="font-size:12px;color:#888;margin-bottom:20px">꾸준히 하면 반드시 영어 실력이 늘어요 💪</div><button onclick="closeModal();renderTaskList();show('list')" style="width:100%;padding:13px;border-radius:12px;background:${B().primary};color:white;font-size:14px;font-weight:700">과제 목록으로 돌아가기</button></div>`);
}

// ── 선생님 대시보드 ──
let teacherUnwatch=null; // watch 해제용

function renderTeacher(){
  // 기존 watch 해제
  if(teacherUnwatch){teacherUnwatch();teacherUnwatch=null;}

  const tc=document.getElementById("teacher-content");
  tc.innerHTML=`<div style="background:${B().primary};border-radius:20px;padding:20px;margin-bottom:16px;color:white"><div style="font-size:18px;font-weight:700">👩‍🏫 선생님 대시보드</div><div style="font-size:13px;opacity:.85;margin-top:4px">불러오는 중...</div></div>`;

  // 로그인으로 버튼 숨기기
  const backLoginBtn=document.querySelector("#p-teacher .back-btn[data-to='login']");
  if(backLoginBtn)backLoginBtn.style.display="none";

  const unsub=window._fbWatch("students",allData=>{
    // 상세 화면 중이면 목록 재렌더 안 함
    if(!document.getElementById("student-list")&&document.getElementById("teacher-content").querySelector(".back-to-list"))return;

    const students=Object.keys(allData||{}).sort();
    tc.innerHTML=`<div style="background:${B().primary};border-radius:20px;padding:20px;margin-bottom:16px;color:white"><div style="font-size:18px;font-weight:700">👩‍🏫 선생님 대시보드</div><div style="font-size:13px;opacity:.85;margin-top:4px">학생 ${students.length}명 · 전체 과제 ${TASKS.length}개</div></div><div id="student-list"></div>`;
    const sl=document.getElementById("student-list");
    if(!students.length){sl.innerHTML=`<div style="text-align:center;padding:40px;color:#aaa;background:white;border-radius:16px">아직 접속한 학생이 없어요</div>`;return;}
    students.forEach(sName=>{
      const d2=allData[sName]?.done||{};
      const cnt=Object.values(d2).filter(Boolean).length;
      const pct=Math.round(cnt/TASKS.length*100);
      const el=document.createElement("div");el.className="card";el.style.cursor="pointer";
      const stageBadges=STAGES.map(st=>{
        const tot=TASKS.filter(t=>t.stage===st.id).length;
        const dn=TASKS.filter(t=>t.stage===st.id&&d2[`task_${t.id}`]).length;
        return `<div style="background:${st.bg};border-radius:8px;padding:3px 8px;display:flex;align-items:center;gap:3px"><span style="font-size:10px;color:${st.color};font-weight:600">${st.name.replace("Stage ","S")}</span><span style="font-size:10px;color:${st.color}">${dn}/${tot}</span></div>`;
      }).join("");
      el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><div style="font-size:16px;font-weight:700;color:#333">${sName}</div><div style="font-size:12px;color:#888;margin-top:2px">${TASKS.length}개 중 ${cnt}개 완료</div></div><div style="display:flex;align-items:center;gap:8px"><div style="width:44px;height:44px;border-radius:50%;background:${pct===100?"#E8F5E9":"#f5e8e0"};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:${pct===100?"#2E7D32":B().primary}">${pct}%</div><span style="color:#ccc;font-size:20px">›</span></div></div><div class="progress" style="margin-bottom:8px"><div class="progress-bar" style="background:${pct===100?"#4CAF50":B().primary};width:${pct}%"></div></div><div style="display:flex;gap:4px;flex-wrap:wrap">${stageBadges}</div>`;
      el.onclick=async()=>{
        if(teacherUnwatch){teacherUnwatch();teacherUnwatch=null;}
        // Firebase에서 최신 데이터 직접 조회
        const fresh=await fbGet(`students/${sName}`);
        renderTeacherDetail(sName,fresh||allData[sName]);
      };
      sl.appendChild(el);
    });
  });
  teacherUnwatch=unsub;
}

function renderTeacherDetail(sName,sData){
  const d2=sData?.done||{};
  const cmts=sData?.comments||{};
  const audio=sData?.audio||{};
  const cnt=Object.values(d2).filter(Boolean).length;
  const pct=Math.round(cnt/TASKS.length*100);
  const tc=document.getElementById("teacher-content");
  tc.innerHTML=`
    <button onclick="renderTeacher()" style="margin-bottom:12px;padding:8px 16px;border-radius:10px;background:white;color:#666;border:1px solid #e0e0e0;font-size:13px">← 전체 학생</button>
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <div style="font-size:20px;font-weight:700;color:#333">${sName} 학생</div>
          <div style="font-size:13px;color:#888;margin-top:2px">${TASKS.length}개 중 ${cnt}개 완료 · ${pct}%</div>
        </div>
        <div style="width:44px;height:44px;border-radius:50%;background:${pct===100?"#E8F5E9":"#f5e8e0"};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:${pct===100?"#2E7D32":B().primary}">${pct}%</div>
      </div>
      <div class="progress"><div class="progress-bar" style="background:${pct===100?"#4CAF50":B().primary};width:${pct}%"></div></div>
    </div>`;

  // 과제 카드 하나씩 추가
  TASKS.forEach(task=>{
    const isDn=!!d2[`task_${task.id}`];
    const st=stOf(task.stage);
    const audioURL2=audio[`task_${task.id}`]||"";
    const savedCmt=cmts[`task_${task.id}`]||"";

    const el=document.createElement("div");
    el.className="card";
    el.style.border=`1.5px solid ${isDn?"#4CAF50":"#f0f0f0"}`;
    el.style.marginBottom="12px";

    let audioHtml="";
    if(audioURL2){
      audioHtml=`<div style="background:#f8f8f8;border-radius:12px;padding:12px;margin-bottom:10px">
        <div style="font-size:12px;font-weight:600;color:#555;margin-bottom:6px">🎵 학생 제출 음성</div>
        <audio src="${audioURL2}" controls style="width:100%;height:36px"></audio>
      </div>`;
    }

    el.innerHTML=`
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="width:32px;height:32px;border-radius:8px;background:${isDn?"#E8F5E9":st.bg};display:flex;align-items:center;justify-content:center;flex-shrink:0">${isDn?"✅":"⬜"}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600;color:#333">${task.title}</div>
          <span class="badge" style="background:${st.bg};color:${st.color}">${st.name}</span>
        </div>
        <div style="font-size:13px;font-weight:700;color:${isDn?"#4CAF50":"#ccc"}">${isDn?"완료":"미완료"}</div>
      </div>
      ${audioHtml}
      <div>
        <div style="font-size:12px;color:#888;margin-bottom:4px">📝 선생님 코멘트</div>
        <div style="display:flex;gap:6px">
          <textarea id="cmt-${task.id}" style="flex:1;padding:8px 12px;border-radius:10px;border:1px solid #e0e0e0;font-size:12px;resize:none;height:56px" placeholder="피드백을 입력하세요...">${savedCmt}</textarea>
          <button onclick="saveComment('${sName}',${task.id})" style="padding:8px 14px;border-radius:10px;background:${B().primary};color:white;font-size:12px;font-weight:600;min-width:50px;align-self:flex-end" id="save-btn-${task.id}">저장</button>
        </div>
      </div>`;
    tc.appendChild(el);
  });
}

async function saveComment(sName,taskId){
  const ta=document.getElementById(`cmt-${taskId}`);
  const btn=document.getElementById(`save-btn-${taskId}`);
  if(!ta||!btn)return;
  btn.textContent="...";btn.disabled=true;
  await fbSet(`students/${sName}/comments/task_${taskId}`,ta.value);
  btn.textContent="✓";btn.style.background="#4CAF50";
  setTimeout(()=>{btn.textContent="저장";btn.style.background=B().primary;btn.disabled=false;},1500);
}

// ── 뒤로가기 버튼 ──
document.querySelectorAll(".back-btn").forEach(btn=>{
  btn.onclick=()=>{
    const to=btn.dataset.to;
    if(to==="stages")renderStages();
    if(to==="list")renderTaskList();
    if(to==="login"){}
    show(to);
  };
});

// ── 초기화 ──
renderLogos();
initLogin();
</script>
</body>
</html>
